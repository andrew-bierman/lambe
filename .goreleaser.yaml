version: 2

project_name: lambe

# Shell completions are generated from the freshly built source so they
# always match the binary being released.
before:
  hooks:
    - sh -c 'rm -rf completions && mkdir completions && for s in bash zsh fish; do go run ./cmd/lambe completion $s > completions/lambe.$s; done'

builds:
  - id: lambe
    main: ./cmd/lambe
    binary: lambe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Reproducible: no build paths, commit time (not build time), fixed mtimes.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -buildid=
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}

archives:
  - id: lambe
    ids: [lambe]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE*
        info: {mtime: "{{ .CommitDate }}"}
      - src: README*
        info: {mtime: "{{ .CommitDate }}"}
      - src: CHANGELOG*
        info: {mtime: "{{ .CommitDate }}"}
      - src: completions/*
        info: {mtime: "{{ .CommitDate }}"}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# Keyless (OIDC) signature for every release artifact (archives, deb/rpm/apk,
# SBOMs and checksums.txt), one `<file>.sigstore.json` bundle each. Verify with
# `cosign verify-blob` as documented in docs/RELEASING.md.
signs:
  - cmd: cosign
    artifacts: all
    output: true
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - artifacts: archive

nfpms:
  - id: lambe
    ids: [lambe]
    package_name: lambe
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    mtime: "{{ .CommitDate }}"
    homepage: https://github.com/andrew-bierman/lambe
    maintainer: Andrew Bierman <94939237+andrew-bierman@users.noreply.github.com>
    description: Supervisor that runs coding agents against a Beads tracker and verifies completion.
    license: GPL-3.0-or-later
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      # An example only: the package never installs or enables a service.
      - src: examples/services/lambe.service
        dst: /usr/share/doc/lambe/examples/lambe.service
      - src: LICENSE
        dst: /usr/share/doc/lambe/LICENSE
      - src: completions/lambe.bash
        dst: /usr/share/bash-completion/completions/lambe
        file_info:
          mode: 0644
      - src: completions/lambe.zsh
        dst: /usr/share/zsh/vendor-completions/_lambe
        file_info:
          mode: 0644
      - src: completions/lambe.fish
        dst: /usr/share/fish/vendor_completions.d/lambe.fish
        file_info:
          mode: 0644

# Homebrew cask (goreleaser's non-deprecated replacement for `brews`). Casks
# support `binary` artifacts on macOS and Linux, and the generated cask has
# on_macos/on_linux x arm/intel blocks. Needs the HOMEBREW_TAP_DEPLOY_KEY secret
# (write deploy key on the tap). The old Formula/lambe.rb must be deleted from the
# tap first; see docs/RELEASING.md "Homebrew".
homebrew_casks:
  - name: lambe
    directory: Casks
    ids: [lambe]
    homepage: https://github.com/andrew-bierman/lambe
    description: Supervisor that runs coding agents against a Beads tracker
    license: GPL-3.0-or-later
    repository:
      owner: andrew-bierman
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:andrew-bierman/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY_PATH }}"
    commit_author:
      name: andrew-bierman
      email: 94939237+andrew-bierman@users.noreply.github.com
    commit_msg_template: "🔖 lambe {{ .Tag }}"
    dependencies:
      - formula: beads
    hooks:
      post:
        # The binary is unsigned (not notarized): without this Gatekeeper reports
        # it "damaged" when a quarantined download is first run on macOS.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lambe"]
          end
    completions:
      bash: completions/lambe.bash
      zsh: completions/lambe.zsh
      fish: completions/lambe.fish
    caveats: |
      lambe drives the Beads tracker through its `bd` binary (formula: beads).
      Next: lambe init && lambe doctor && lambe service install
