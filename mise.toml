[tools]
go = "1.27.4"
goreleaser = "2.20.2"

[tasks."dashboard:build"]
description = "Build the LambeDash native dashboard app"
run = "xcodebuild -project apps/dashboard/LambeDash.xcodeproj -scheme LambeDash -destination 'platform=macOS' -derivedDataPath apps/dashboard/DerivedData build"

[tasks."dashboard:test"]
description = "Run the LambeDash Swift Testing suite"
run = "xcodebuild -project apps/dashboard/LambeDash.xcodeproj -scheme LambeDash -destination 'platform=macOS' -derivedDataPath apps/dashboard/DerivedData test"
