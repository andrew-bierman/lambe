name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# One run per PR; a new push cancels the stale PR run. Pushes (master, tags) use a
# per-SHA group and are never cancelled: a shared group would let GitHub drop the
# older pending run when several PRs land minutes apart.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Docs-only PRs skip the Go work. The jobs below still run (and report success)
  # so the required status names `check` and `test` stay stable.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          go=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename')
            if [ -z "$(printf '%s\n' "$files" | grep -Ev '^(docs/|[^/]+\.md$|LICENSE$|NOTICE$|\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$|CODEOWNERS$|dependabot\.yml$|[^/]+\.md$))' || true)" ]; then
              go=false
            fi
          fi
          echo "go=${go}" >> "$GITHUB_OUTPUT"
          echo "run go jobs: ${go}"

  check:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_GO: ${{ needs.changes.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_GO == 'true'
        with:
          persist-credentials: false
      - name: CHANGELOG section for release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME}" > /dev/null
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.RUN_GO == 'true'
        with:
          go-version: "1.27.4" # keep equal to mise.toml; go.mod `go` is the lowest supported
      - name: Go pin matches mise.toml
        if: env.RUN_GO == 'true'
        run: |
          want=$(sed -n 's/^go = "\(.*\)"/\1/p' mise.toml)
          for f in .github/workflows/*.yml; do
            grep -nE '^ +go-version:' "$f" | grep -v "\"$want\"" && { echo "::error::$f: go-version differs from mise.toml ($want)"; exit 1; } || true
          done
      - name: go vet
        if: env.RUN_GO == 'true'
        run: go vet ./...
      - name: gofumpt
        if: env.RUN_GO == 'true'
        run: |
          out=$(go run mvdan.cc/gofumpt -l .)
          if [ -n "$out" ]; then
            echo "gofumpt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: golangci-lint
        if: env.RUN_GO == 'true'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint run ./...
      - name: staticcheck
        if: env.RUN_GO == 'true'
        run: go run honnef.co/go/tools/cmd/staticcheck ./...
      - name: govulncheck
        if: env.RUN_GO == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck ./...

  test:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_GO: ${{ needs.changes.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_GO == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.RUN_GO == 'true'
        with:
          go-version: "1.27.4" # keep equal to mise.toml; go.mod `go` is the lowest supported
      - name: Install bd
        if: env.RUN_GO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Pinned release + checksum (published in the release's checksums.txt); bump together.
          ver=1.3.4
          sha=175c26904bde3ff9168d2282ff6b56f17b17f60c22fa5acb3dacc9fb3465303a
          tarball="beads_${ver}_linux_amd64.tar.gz"
          gh release download "v${ver}" --repo gastownhall/beads --pattern "$tarball" --dir "$RUNNER_TEMP"
          echo "${sha}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "$RUNNER_TEMP" bd
          mkdir -p "$HOME/.local/bin"
          mv "${RUNNER_TEMP}/bd" "$HOME/.local/bin/bd"
          "$HOME/.local/bin/bd" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test (with bd integration)
        if: env.RUN_GO == 'true'
        env:
          LAMBE_TEST_BD: "1"
        run: go test -race -timeout 15m ./...

  rex-lua:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install luajit
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Rex integration tests
        run: luajit contrib/rex/test/run.lua

  build:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUN_GO: ${{ needs.changes.outputs.go }}
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_GO == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.RUN_GO == 'true'
        with:
          go-version: "1.27.4" # keep equal to mise.toml; go.mod `go` is the lowest supported
      - name: Build
        if: env.RUN_GO == 'true'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "dist/lambe-${GOOS}-${GOARCH}" ./cmd/lambe
