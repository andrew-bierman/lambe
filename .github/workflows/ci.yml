name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# One run per PR; a new push cancels the stale run. Branch and tag runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Docs-only PRs skip the Go work. The jobs below still run (and report success)
  # so the required status names `check` and `test` stay stable.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          go=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename')
            if [ -z "$(printf '%s\n' "$files" | grep -Ev '^(docs/|[^/]+\.md$|LICENSE$|NOTICE$|\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$|CODEOWNERS$|dependabot\.yml$|[^/]+\.md$))' || true)" ]; then
              go=false
            fi
          fi
          echo "go=${go}" >> "$GITHUB_OUTPUT"
          echo "run go jobs: ${go}"

  check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_GO: ${{ needs.changes.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_GO == 'true'
        with:
          persist-credentials: false
      - name: CHANGELOG section for release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME}" > /dev/null
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.RUN_GO == 'true'
        with:
          go-version: "1.27.x"
      - name: go vet
        if: env.RUN_GO == 'true'
        run: go vet ./...
      - name: gofumpt
        if: env.RUN_GO == 'true'
        run: |
          out=$(go run mvdan.cc/gofumpt -l .)
          if [ -n "$out" ]; then
            echo "gofumpt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: golangci-lint
        if: env.RUN_GO == 'true'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint run ./...
      - name: staticcheck
        if: env.RUN_GO == 'true'
        run: go run honnef.co/go/tools/cmd/staticcheck ./...
      - name: govulncheck
        if: env.RUN_GO == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck ./...

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_GO: ${{ needs.changes.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_GO == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.RUN_GO == 'true'
        with:
          go-version: "1.27.x"
      - name: Install bd
        if: env.RUN_GO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Prefer a stable 1.4.x release; fall back to the latest 1.3.x.
          version=$(gh release list --repo gastownhall/beads --limit 20 --json tagName \
            --jq '[.[] | select(.tagName | test("^v1\\.4\\.[0-9]+$"))][0].tagName // empty')
          if [ -z "$version" ]; then
            version=$(gh release list --repo gastownhall/beads --limit 20 --json tagName \
              --jq '[.[] | select(.tagName | test("^v1\\.3\\.[0-9]+$"))][0].tagName // empty')
          fi
          if [ -z "$version" ]; then
            echo "no bd 1.3.x/1.4.x release found" >&2
            exit 1
          fi
          echo "installing bd $version"
          ver=${version#v}
          gh release download "$version" --repo gastownhall/beads \
            --pattern "beads_${ver}_linux_amd64.tar.gz" --output - | tar -xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          mv /tmp/bd "$HOME/.local/bin/bd"
          chmod +x "$HOME/.local/bin/bd"
          "$HOME/.local/bin/bd" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test (with bd integration)
        if: env.RUN_GO == 'true'
        env:
          LAMBE_TEST_BD: "1"
        run: go test -race ./...

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_GO: ${{ needs.changes.outputs.go }}
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_GO == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.RUN_GO == 'true'
        with:
          go-version: "1.27.x"
      - name: Build
        if: env.RUN_GO == 'true'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "dist/lambe-${GOOS}-${GOARCH}" ./cmd/lambe
