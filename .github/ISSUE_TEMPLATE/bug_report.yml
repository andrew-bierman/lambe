name: Bug report
description: Report something broken in lambe
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please scrub tokens, private paths and issue contents you do not want public.
        Security problems go through a [private advisory](https://github.com/andrew-bierman/lambe/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What is wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, config and tracker state that trigger it.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: "`lambe version --json` output"
      render: json
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`lambe doctor` output"
      description: Paste the full ok/warn/fail report (`lambe doctor --json` also works).
      render: text
    validations:
      required: true
  - type: input
    id: bd
    attributes:
      label: "`bd version`"
      placeholder: bd version 1.4.x
  - type: input
    id: env
    attributes:
      label: OS and harness
      placeholder: macOS 15 arm64, Pi
  - type: textarea
    id: config
    attributes:
      label: Sanitized configuration
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
