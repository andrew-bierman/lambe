name: Feature request
description: Propose something for lambe
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, daemon, tracker, harness, gate, Rex, docs, other]
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, mockups, Symphony spec sections.
